name: skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # --root points discovery at the checkout (the scripts otherwise scan
      # HOME-based skill roots). Frontmatter, id/description budget, drift.
      - run: node scripts/validate-skills.mjs --root skills
      # Every references/evals.md still parses. Full evals need `opencode` and a
      # model provider key, so they stay local (or run manually).
      - run: node scripts/run-evals.mjs --root skills --list
      # The JS and Python docs-check sensors must agree (references/docs-check.md).
      - run: node scripts/check-sensor-parity.mjs
      # This repo ships authored skills only. Third-party skills stay installed
      # locally (see README) and must never become tracked files again.
      - name: No third-party skills redistributed
        run: |
          test -f LICENSE
          if git ls-files skills | grep -E '^skills/(agent-browser|impeccable|graphify|find-skills|orchestration)/'; then
            echo "::error::third-party skill tracked; it is not redistributed in this repo"
            exit 1
          fi
