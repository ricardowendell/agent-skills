name: skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # Pinned: `ubuntu-latest` moves to Ubuntu 26 from 2026-10-19, and a CI that
    # changes under a green build hides which image actually ran.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # spec-check reads the base commit from the push/PR event; a shallow
          # checkout would make `git diff <base>...HEAD` fail.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # --root points discovery at the checkout (the scripts otherwise scan
      # HOME-based skill roots). Frontmatter, id/description budget, drift.
      - run: node scripts/validate-skills.mjs --root skills
      # Cases parse, and every case has a prompt, a known assertion kind and a
      # unique number. Behavioural runs need a model provider, so they stay local.
      - run: node scripts/run-evals.mjs --root skills --list --check
      # The spec contract: files: against the base diff, task: against
      # backlog/tasks, dependency symmetry, and the ready/implemented body rules.
      # Only a pull request has a per-spec base: the branch point. On a push to
      # main the range is the cumulative local fan-in, and an already-merged
      # spec's files: would be compared with every later change. Skip it there;
      # the local pre-merge run is the gate (CONTRIBUTING.md).
      - name: Spec contract for changed specs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit; spec-check skipped"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- 'docs/specs/*.md' 'docs/specs/active/*.md')
          for spec in $changed; do
            if [ -f "$spec" ]; then
              node scripts/spec-check.mjs --spec "$spec" --base "$BASE_SHA"
            fi
          done
      # The runner's own tests: parser, globs, assertions, fixture staging.
      # Coverage is reported, not enforced: a numeric floor needs a baseline
      # measured on the same Node the workflow pins.
      - name: Harness tests and coverage
        run: |
          node --version
          node --test --experimental-test-coverage scripts/lib/evals/*.test.mjs
      # Harness-side helpers that are not about evals, e.g. the backlog comment
      # append that works around the CLI's lossy parser (TASK-55).
      - run: node --test scripts/lib/*.test.mjs
      # The state script decides "complete" for every repo the bootstrap touches,
      # so its list and the templates must agree.
      - run: node --test skills/bootstrap-project-harness/scripts/*.test.mjs
      # The JS and Python docs-check sensors must agree (references/docs-check.md).
      - run: node scripts/check-sensor-parity.mjs
      # This repo ships authored skills only. Third-party skills stay installed
      # locally (see README) and must never become tracked files again.
      - name: No third-party skills redistributed
        run: |
          test -f LICENSE
          if git ls-files skills | grep -E '^skills/(agent-browser|impeccable|graphify|find-skills|orchestration|skill-creator)/'; then
            echo "::error::third-party skill tracked; it is not redistributed in this repo"
            exit 1
          fi
