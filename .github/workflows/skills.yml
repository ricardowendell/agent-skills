name: skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # Pinned: `ubuntu-latest` moves to Ubuntu 26 from 2026-10-19, and a CI that
    # changes under a green build hides which image actually ran.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # --root points discovery at the checkout (the scripts otherwise scan
      # HOME-based skill roots). Frontmatter, id/description budget, drift.
      - run: node scripts/validate-skills.mjs --root skills
      # Cases parse, and every case has a prompt, a known assertion kind and a
      # unique number. Behavioural runs need a model provider, so they stay local.
      - run: node scripts/run-evals.mjs --root skills --list --check
      # The runner's own tests: parser, globs, assertions, fixture staging.
      - run: node --test scripts/lib/evals/*.test.mjs
      # The state script decides "complete" for every repo the bootstrap touches,
      # so its list and the templates must agree.
      - run: node --test skills/bootstrap-project-harness/scripts/*.test.mjs
      # The JS and Python docs-check sensors must agree (references/docs-check.md).
      - run: node scripts/check-sensor-parity.mjs
      # This repo ships authored skills only. Third-party skills stay installed
      # locally (see README) and must never become tracked files again.
      - name: No third-party skills redistributed
        run: |
          test -f LICENSE
          if git ls-files skills | grep -E '^skills/(agent-browser|impeccable|graphify|find-skills|orchestration|skill-creator)/'; then
            echo "::error::third-party skill tracked; it is not redistributed in this repo"
            exit 1
          fi
