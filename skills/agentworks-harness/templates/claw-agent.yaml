# Governed Claw agent — real code execution inside an OpenShell sandbox.
#
# Preconditions (check cluster_context first): capability_policies + claw.create
# + deploy affordances are `allowed` and the sandbox runtime is ready. Create the
# capability policy FIRST (templates/capability-policy.json) and paste its id.
# model_ref must be sandbox-routable AND inside the policy's models.allow.
# Deploy with a shell surface binding and invoke with
# interaction_surface.kind = "shell".
#
# Required fields: name, slug, workspace_id, goal, claw_spec, capability_policy_id.
name: Sandbox Coder
slug: sandbox-coder
workspace_id: "<WORKSPACE_ID>"
goal: Implement and test small code changes in a governed sandbox, then summarize what changed.
model_ref: "<SANDBOX_ROUTABLE_MODEL_REF>"
system_prompt: You are a careful coding agent. Make minimal changes and run the tests before finishing.

memory_config:
  enabled: true                  # run-only memory (the default)
  llm_model_id: "<MODEL_REF>"
  # Run-only memory needs no embedding model. Shared memory
  # (shared_across_users: true) also needs one — and a deliberate decision:
  # embedding_model_id: "<EMBEDDING_MODEL_REF>"

claw_spec:
  binary_profile: nemoclaw       # the sandbox coding-agent profile

capability_policy_id: "<CAPABILITY_POLICY_ID>"
