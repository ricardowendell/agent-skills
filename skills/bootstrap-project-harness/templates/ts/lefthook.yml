# Pre-commit is fast and offline: staged files plus the type and test gate, all
# local. Anything that needs the network (the audit) runs on pre-push, so an
# offline laptop never learns to bypass the hook.
pre-commit:
  parallel: true
  commands:
    sensitive-files:
      run: |
        staged=$(git diff --cached --name-only)
        for f in $staged; do
          case "$f" in
            *.env|*.env.*|*.db|data/*)
              echo "ERROR: $f looks sensitive — remove it from the stage."
              exit 1
              ;;
          esac
        done
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css}"
      run: node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: node_modules/.bin/oxlint {staged_files}
    typecheck:
      run: npm run typecheck
    test:
      run: npm test

# Pre-push runs the full local set, the optional build, the docs sensor and the
# audit (fail-open when the registry is unreachable, fail on a real finding).
pre-push:
  commands:
    check:
      run: npm run check
    build:
      run: npm run build --if-present
    docs-check:
      run: npm run docs:check
    audit:
      run: node audit-gate.mjs

commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}
